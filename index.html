<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Daymark</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242424;background:#f8f8f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:450px;margin:auto;padding:42px 22px 32px}h1{font-size:25px;font-weight:650;letter-spacing:-.8px;margin:0 0 7px}.sub{color:#888;font-size:13px;margin:0 0 38px}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.month strong{font-size:18px;font-weight:600}.nav{border:0;background:transparent;font-size:26px;cursor:pointer;width:42px;height:42px;color:#555}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.week{margin-bottom:10px;color:#999;font-size:11px;text-align:center}.day{aspect-ratio:1;border:1px solid transparent;border-radius:12px;background:transparent;color:#333;font:inherit;font-size:14px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}.day.today{border-color:#b7b7b7}.day.selected{outline:2px solid #343434;outline-offset:1px}.day.has{font-weight:650}.day.positive{background:#dcefe3}.day.negative{background:#f5dfdc}.day.neutral{background:#e8e8e5}.day:focus-visible,.rate:focus-visible{outline:2px solid #333;outline-offset:2px}.panel{border-top:1px solid #e5e5e1;margin-top:32px;padding-top:26px}.date{font-size:17px;font-weight:600;margin-bottom:5px}.hint{font-size:13px;color:#888;margin-bottom:20px}.rates{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}.rate{border:1px solid #e0e0dc;border-radius:8px;background:white;min-height:39px;font-size:12px;cursor:pointer;color:#555;padding:0}.rate.active{background:#242424;color:white;border-color:#242424}.legend{display:flex;justify-content:space-between;color:#999;font-size:11px;margin-top:10px}.clear{margin-top:19px;background:none;border:0;color:#888;text-decoration:underline;font-size:12px;padding:8px 0;cursor:pointer}.clear:disabled{opacity:.3;cursor:default}.footer{font-size:11px;color:#aaa;margin-top:36px;text-align:center}@media(max-width:350px){main{padding:28px 14px}.week,.days{gap:4px}.rates{gap:2px}.rate{font-size:11px}}
</style></head><body><main><h1>Daymark</h1><p class="sub">A little progress, every day.</p><div class="month"><button class="nav" id="prev" aria-label="Previous month">‹</button><strong id="month"></strong><button class="nav" id="next" aria-label="Next month">›</button></div><div class="week"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="days" id="days"></div><section class="panel"><div class="date" id="date"></div><div class="hint">How was your day?</div><div class="rates" id="rates"></div><div class="legend"><span>Very difficult</span><span>Neutral</span><span>Excellent</span></div><button class="clear" id="clear">Clear rating</button></section><p class="footer">Saved on this device · Works offline</p></main><script>
const STORE='daymark-ratings-v1';let ratings={};try{const saved=JSON.parse(localStorage.getItem(STORE)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))ratings=saved}catch(e){}const now=new Date();let selected=new Date(now.getFullYear(),now.getMonth(),now.getDate());let shown=new Date(now.getFullYear(),now.getMonth(),1);const $=id=>document.getElementById(id);const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(ratings))}catch(e){alert('Could not save your rating. Check your device storage settings.')}};function render(){ $('month').textContent=shown.toLocaleDateString(undefined,{month:'long',year:'numeric'});$('days').replaceChildren();let offset=new Date(shown.getFullYear(),shown.getMonth(),1).getDay();for(let i=0;i<offset;i++)$('days').append(document.createElement('span'));const count=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();for(let d=1;d<=count;d++){let date=new Date(shown.getFullYear(),shown.getMonth(),d),k=key(date),v=ratings[k],b=document.createElement('button');b.className='day';b.textContent=d;b.setAttribute('aria-label',`${date.toDateString()}${Number.isInteger(v)?`, rating ${v}`:''}`);if(k===key(now))b.classList.add('today');if(k===key(selected))b.classList.add('selected');if(Number.isInteger(v)){b.classList.add('has',v>0?'positive':v<0?'negative':'neutral')}b.onclick=()=>{selected=date;render()};$('days').append(b)}$('date').textContent=selected.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});$('rates').replaceChildren();for(let n=-5;n<=5;n++){let b=document.createElement('button');b.className='rate'+(ratings[key(selected)]===n?' active':'');b.textContent=n>0?'+'+n:String(n);b.setAttribute('aria-label',`Rate day ${n}`);b.setAttribute('aria-pressed',String(ratings[key(selected)]===n));b.onclick=()=>{ratings[key(selected)]=n;save();render()};$('rates').append(b)}$('clear').disabled=!Object.hasOwn(ratings,key(selected))} $('prev').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);render()};$('next').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);render()};$('clear').onclick=()=>{delete ratings[key(selected)];save();render()};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
